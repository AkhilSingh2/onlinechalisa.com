<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Diya — traditional oil lamp">
  <defs>
    <!-- Warm halo behind the flame -->
    <radialGradient id="diya-glow" cx="50%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#ffcf7a" stop-opacity="0.85" />
      <stop offset="55%" stop-color="#ff9a3c" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ff9a3c" stop-opacity="0" />
    </radialGradient>

    <!-- Flame: hot yellow core → saffron edge -->
    <linearGradient id="diya-flame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fff6d5" />
      <stop offset="35%" stop-color="#ffd07a" />
      <stop offset="75%" stop-color="#ff9a3c" />
      <stop offset="100%" stop-color="#ed8936" />
    </linearGradient>

    <!-- Terracotta vessel: warm clay ochre → deep umber -->
    <linearGradient id="diya-vessel" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#c96a1a" />
      <stop offset="55%" stop-color="#9c5013" />
      <stop offset="100%" stop-color="#5a2c07" />
    </linearGradient>

    <!-- Subtle rim highlight on the vessel lip -->
    <linearGradient id="diya-rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3e0f" />
      <stop offset="50%" stop-color="#e88a3a" />
      <stop offset="100%" stop-color="#7c3e0f" />
    </linearGradient>
  </defs>

  <!-- Ambient glow -->
  <circle cx="64" cy="52" r="46" fill="url(#diya-glow)" />

  <!-- Flame -->
  <g>
    <path
      d="M64 20 C 70 30 76 38 76 48 a 12 12 0 0 1 -24 0 c 0 -10 6 -18 12 -28 Z"
      fill="url(#diya-flame)"
    />
    <!-- Inner hot core -->
    <path
      d="M64 34 C 66.5 40 69 45 69 50 a 5 5 0 0 1 -10 0 c 0 -5 2.5 -10 5 -16 Z"
      fill="#fff2c2"
      opacity="0.9"
    />
  </g>

  <!-- Wick -->
  <path d="M63 66 h2 v-8 h-2 Z" fill="#3a1f0a" />

  <!-- Oil pool highlight (inside the bowl lip) -->
  <ellipse cx="64" cy="72" rx="30" ry="4" fill="#f4b46a" opacity="0.55" />

  <!-- Vessel: classic pinched-lip diya silhouette -->
  <path
    d="
      M 20 74
      Q 22 68 30 68
      L 42 68
      Q 46 62 64 62
      Q 82 62 86 68
      L 98 68
      Q 106 68 108 74
      Q 106 96 90 104
      Q 78 110 64 110
      Q 50 110 38 104
      Q 22 96 20 74
      Z"
    fill="url(#diya-vessel)"
  />

  <!-- Rim highlight -->
  <path
    d="M 22 74 Q 24 71 30 71 L 98 71 Q 104 71 106 74"
    stroke="url(#diya-rim)"
    stroke-width="1.4"
    stroke-linecap="round"
    fill="none"
    opacity="0.7"
  />

  <!-- Base shadow to ground the lamp -->
  <ellipse cx="64" cy="114" rx="34" ry="3" fill="#000" opacity="0.18" />
</svg>
