<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Diya — traditional oil lamp" width="128" height="128"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:creator>RealFaviconGenerator</dc:creator><dc:source>https://realfavicongenerator.net</dc:source></rdf:Description></rdf:RDF></metadata><defs>
    <!-- Warm halo behind the flame -->
    <radialGradient id="diya-glow" cx="50%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#ffcf7a" stop-opacity="0.85"></stop>
      <stop offset="55%" stop-color="#ff9a3c" stop-opacity="0.25"></stop>
      <stop offset="100%" stop-color="#ff9a3c" stop-opacity="0"></stop>
    </radialGradient>

    <!-- Flame: hot yellow core → saffron edge -->
    <linearGradient id="diya-flame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fff6d5"></stop>
      <stop offset="35%" stop-color="#ffd07a"></stop>
      <stop offset="75%" stop-color="#ff9a3c"></stop>
      <stop offset="100%" stop-color="#ed8936"></stop>
    </linearGradient>

    <!-- Terracotta vessel: warm clay ochre → deep umber -->
    <linearGradient id="diya-vessel" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#c96a1a"></stop>
      <stop offset="55%" stop-color="#9c5013"></stop>
      <stop offset="100%" stop-color="#5a2c07"></stop>
    </linearGradient>

    <!-- Subtle rim highlight on the vessel lip -->
    <linearGradient id="diya-rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3e0f"></stop>
      <stop offset="50%" stop-color="#e88a3a"></stop>
      <stop offset="100%" stop-color="#7c3e0f"></stop>
    </linearGradient>
  </defs><circle cx="64" cy="52" r="46" fill="url(#diya-glow)"></circle><g>
    <path d="M64 20 C 70 30 76 38 76 48 a 12 12 0 0 1 -24 0 c 0 -10 6 -18 12 -28 Z" fill="url(#diya-flame)"></path>
    <!-- Inner hot core -->
    <path d="M64 34 C 66.5 40 69 45 69 50 a 5 5 0 0 1 -10 0 c 0 -5 2.5 -10 5 -16 Z" fill="#fff2c2" opacity="0.9"></path>
